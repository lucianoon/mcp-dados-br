[project]
name = "mcp-dados-br"
version = "0.5.2"
description = "Servidor MCP com dados públicos brasileiros: IBGE, Banco Central, INMET, Câmara dos Deputados e Senado Federal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Luciano" }]
keywords = ["mcp", "dados-abertos", "ibge", "banco-central", "inmet", "camara", "senado", "brasil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.28",
    "mcp>=2.1.1",
    "pydantic>=2.13.5",
    # Usados diretamente pela autenticação bearer do transporte HTTP; já vêm
    # com o SDK MCP, declarados aqui para não depender de dependência transitiva.
    "starlette>=0.48",
    "uvicorn>=0.31.1",
]

[project.urls]
Repository = "https://github.com/lucianoon/mcp-dados-br"

[project.scripts]
mcp-dados-br = "mcp_dados_br.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.16.5",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: testes que consultam as APIs reais (rodar com -m integration)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dados_br"]
