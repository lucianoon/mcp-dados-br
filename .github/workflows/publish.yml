name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist e wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Confere se a tag bate com a versao do pyproject
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$tag  pyproject=$proj"
          test "$tag" = "$proj" || { echo "::error::Tag $tag difere da versao $proj no pyproject.toml"; exit 1; }

      - name: Build
        run: uv build

      - name: Checa metadados do pacote
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publica no PyPI (Trusted Publishing)
    needs: build
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-dados-br
    permissions:
      id-token: write      # exigido pelo OIDC do Trusted Publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Usa PYPI_API_TOKEN se configurado; sem secret, cai para Trusted Publishing (OIDC).
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  registry:
    name: Publica no MCP Registry
    needs: publish
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sincroniza versão do server.json com a tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          jq --arg v "$VERSION" '.packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Autentica no MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publica no MCP Registry
        run: ./mcp-publisher publish
